<!DOCTYPE html>


<head>
    <link rel="stylesheet" href="styles.css">
</head>

<script src="script.js" defer></script>

<html>

<body>
    <div>
        <h1>🍕 challenge 2026</h1>
        <p>every week, a unique pizza</p>
        <p>(just dummy data for now)</p>
    </div>
    <table id="pizza-table">
        <thead>
            <tr>
                <th scope="col">Week</th>
                <th scope="col">Day</th>
                <th scope="col">Name</th>
                <th scope="col">Resturant</th>
                <th scope="col">Ingredients</th>
                <th scope="col">Cost</th>
                <th scope="col">Rating 0-10</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row">1</th>
                <td>Tue</td>
                <td>Vesuvio</td>
                <td>Resturant</td>
                <td data-ingredients="cheese,tomato,ham">cheese,tomato,ham</td>
                <td data-cost="123">123</td>
                <td>5</td>
            </tr>
            <tr>
                <th scope="row">2</th>
                <td>Mon</td>
                <td>Caprisosa</td>
                <td>Resturant</td>
                <td data-ingredients="cheese,ham,mushrrom">cheese,ham,mushroom</td>
                <td data-cost="200">200</td>
                <td>3</td>
            </tr>
        </tbody>
    </table>




    <table id="ingredient-count-table">
        <thead>
            <tr>
                <th>Ingredient</th>
                <th>Count</th>
            </tr>
        </thead>
        <tbody id="ingredient-count-body">
        </tbody>
    </table>

    <div style="display: flex; gap: 10px;">
        <p> Total amount spent </p>
        <p id="total-cost">0.00</p>
    </div>


</body>

</html>
